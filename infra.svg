<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Cloudflare tunnels into two servers, neo and cayde, which are linked over Tailscale and WireGuard.">
  <style>
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .node { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #1f2328; font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .key { fill: #8c959f; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .val { fill: #57606a; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .edge { fill: #8c959f; font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
    .wire { stroke: #d0d7de; }
    .flow { stroke: #1a7f37; animation: flow 1.2s linear infinite; }
    .flow.rev { animation-direction: reverse; }
    .a { fill: #1a7f37; }
    .b { fill: #0969da; }
    .o { fill: #bc4c00; }
    .label { fill: #8c959f; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
    .ring { fill: none; stroke: #1a7f37; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0d1117; stroke: #30363d; }
      .node { fill: #161b22; stroke: #30363d; }
      .title { fill: #e6edf3; }
      .key { fill: #6e7681; }
      .val { fill: #8b949e; }
      .edge { fill: #6e7681; }
      .wire { stroke: #21262d; }
      .flow { stroke: #7ee787; }
      .a { fill: #7ee787; }
      .b { fill: #79c0ff; }
      .o { fill: #ffa657; }
      .label { fill: #6e7681; }
      .ring { stroke: #7ee787; }
    }
  </style>

  <defs>
    <path id="cf-neo"   d="M 440 96 C 440 160, 200 140, 200 200"/>
    <path id="neo-cf"   d="M 200 200 C 200 140, 440 160, 440 96"/>
    <path id="cf-cay"   d="M 560 96 C 560 160, 800 140, 800 200"/>
    <path id="cay-cf"   d="M 800 200 C 800 140, 560 160, 560 96"/>
    <path id="neo-cay"  d="M 330 250 C 450 250, 550 250, 670 250"/>
    <path id="cay-neo"  d="M 670 250 C 550 250, 450 250, 330 250"/>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="999" height="329" rx="14"/>
  <text class="label" x="36" y="44"><tspan class="a">●</tspan> MY HOMELAB</text>

  <!-- wires: solid base + flowing dashes -->
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <use href="#cf-neo" class="wire"/><use href="#cf-cay" class="wire"/><use href="#neo-cay" class="wire"/>
  </g>
  <g fill="none" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6">
    <use href="#cf-neo" class="flow"/><use href="#cf-cay" class="flow"/><use href="#neo-cay" class="flow rev"/>
  </g>

  <text class="edge" x="268" y="136">TUNNEL</text>
  <text class="edge" x="682" y="136">TUNNEL</text>
  <text class="edge" x="420" y="236">TAILSCALE · WIREGUARD</text>

  <!-- comet packets: head + fading tail -->
  <g id="comets">
    <!-- cloudflare → neo -->
    <g class="a">
      <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"><mpath href="#cf-neo"/></animateMotion></circle>
      <circle r="3" opacity="0.5"><animateMotion dur="2.4s" begin="-0.06s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"><mpath href="#cf-neo"/></animateMotion></circle>
      <circle r="2" opacity="0.25"><animateMotion dur="2.4s" begin="-0.12s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"><mpath href="#cf-neo"/></animateMotion></circle>
    </g>
    <!-- neo → cloudflare -->
    <g class="b">
      <circle r="3.5"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"><mpath href="#neo-cf"/></animateMotion></circle>
      <circle r="2.5" opacity="0.45"><animateMotion dur="2.4s" begin="1.14s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"><mpath href="#neo-cf"/></animateMotion></circle>
    </g>
    <!-- cloudflare → cayde -->
    <g class="a">
      <circle r="4"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"><mpath href="#cf-cay"/></animateMotion></circle>
      <circle r="3" opacity="0.5"><animateMotion dur="2.4s" begin="0.54s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"><mpath href="#cf-cay"/></animateMotion></circle>
      <circle r="2" opacity="0.25"><animateMotion dur="2.4s" begin="0.48s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"><mpath href="#cf-cay"/></animateMotion></circle>
    </g>
    <!-- cayde → cloudflare -->
    <g class="b">
      <circle r="3.5"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"><mpath href="#cay-cf"/></animateMotion></circle>
      <circle r="2.5" opacity="0.45"><animateMotion dur="2.4s" begin="1.74s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"><mpath href="#cay-cf"/></animateMotion></circle>
    </g>
    <!-- neo ⇄ cayde -->
    <g class="o">
      <circle r="4"><animateMotion dur="1.8s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 0.5 1"><mpath href="#neo-cay"/></animateMotion></circle>
      <circle r="3" opacity="0.5"><animateMotion dur="1.8s" begin="-0.05s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 0.5 1"><mpath href="#neo-cay"/></animateMotion></circle>
    </g>
    <g class="b">
      <circle r="4"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 0.5 1"><mpath href="#cay-neo"/></animateMotion></circle>
      <circle r="3" opacity="0.5"><animateMotion dur="1.8s" begin="0.85s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.5 0 0.5 1"><mpath href="#cay-neo"/></animateMotion></circle>
    </g>
  </g>

  <!-- cloudflare -->
  <rect class="node" x="390" y="36" width="220" height="60" rx="10"/>
  <text class="title" x="412" y="72">cloudflare</text>
  <circle class="a" cx="586" cy="66" r="4"/>
  <circle class="ring" cx="586" cy="66" r="4" stroke-width="1.5">
    <animate attributeName="r" values="4;14" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- neo -->
  <rect class="node" x="70" y="200" width="260" height="100" rx="10"/>
  <text class="title" x="92" y="232">neo</text>
  <text class="key" x="92" y="260">cpu</text><text class="val" x="132" y="260">threadripper</text>
  <text class="key" x="92" y="282">gpu</text><text class="val" x="132" y="282">rtx pro 4000 blackwell</text>
  <circle class="a" cx="306" cy="226" r="4"/>
  <circle class="ring" cx="306" cy="226" r="4" stroke-width="1.5">
    <animate attributeName="r" values="4;14" dur="2.4s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- cayde -->
  <rect class="node" x="670" y="200" width="260" height="100" rx="10"/>
  <text class="title" x="692" y="232">cayde</text>
  <text class="key" x="692" y="260">cpu</text><text class="val" x="732" y="260">threadripper</text>
  <text class="key" x="692" y="282">gpu</text><text class="val" x="732" y="282">rtx 4000 ada</text>
  <circle class="a" cx="906" cy="226" r="4"/>
  <circle class="ring" cx="906" cy="226" r="4" stroke-width="1.5">
    <animate attributeName="r" values="4;14" dur="2.4s" begin="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
