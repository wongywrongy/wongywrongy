<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Kyle — cs @ sjsu">
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .name { fill: #1f2328; font: 700 60px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -1px; }
    .line { fill: #57606a; font: 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .accent { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .name { fill: #e6edf3; }
      .line { fill: #8b949e; }
      .accent { fill: #7ee787; }
    }
  </style>

  <defs>
    <clipPath id="c1"><rect x="40" y="136" height="26" width="0"><animate attributeName="width" from="0" to="400" begin="0.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="166" height="26" width="0"><animate attributeName="width" from="0" to="400" begin="1.1s" dur="1.1s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="999" height="219" rx="14"/>

  <text class="name" x="46" y="112">Kyle</text>
  <g clip-path="url(#c1)"><text class="line" x="48" y="155"><tspan class="accent">›</tspan> cs @ sjsu</text></g>
  <g clip-path="url(#c2)"><text class="line" x="48" y="185"><tspan class="accent">›</tspan> software engineer @ yunavero</text></g>
  <rect class="accent" x="342" y="171" width="9" height="18" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.5;0.51" dur="1s" begin="2.3s" repeatCount="indefinite"/>
  </rect>

</svg>
